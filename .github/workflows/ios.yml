name: iOS アプリ

# check      … スクショを撮り（Linux）、Mac で組み立ててシミュレーターで起動を確かめる（Apple の鍵はいらない）
# testflight … 署名して TestFlight に送る
# store      … ストアの文とスクショを App Store Connect に送る（審査には出さない）
# review     … 審査に出す（文とスクショは送らない。先に store で送っておく）
# preview    … App Store のプレビュー動画（本物の画面の録画）を作って成果物にするだけ（送らない。Mac も使わない）
#              store でも、app.json に preview があるアプリは動画を作り、文とスクショのあとに送る（前の動画は入れかえ）
on:
  workflow_dispatch:
    inputs:
      app:
        description: アプリ（apps/ の中のフォルダ名）
        required: true
        default: hiragana-balance
      mode:
        description: すること
        type: choice
        options: [check, testflight, store, review, preview]
        default: check
      ref:
        description: ゲームの版（コミットやタグ。空なら app.json のまま）
        required: false
        default: ""
  # ゲームのリポジトリのリリースから呼ぶとき: {"app": "...", "ref": "v1.2", "mode": "testflight"}
  repository_dispatch:
    types: [game-release]
  push:
    branches: [main]
    paths: ["apps/**", "shell/**", "scripts/**", ".github/workflows/ios.yml"]
  # PR でも check（スクショ・Mac での組み立てと起動。Apple の鍵はいらない）
  pull_request:
    paths: ["apps/**", "shell/**", "scripts/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.inputs.app || github.event.client_payload.app || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
      mode: ${{ steps.p.outputs.mode }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          from pathlib import Path
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          name = os.environ["EVENT"]
          if name == "workflow_dispatch":
              i = ev["inputs"]; apps, mode, ref = [i["app"]], i["mode"], i.get("ref", "")
          elif name == "repository_dispatch":
              p = ev.get("client_payload", {}); apps, mode, ref = [p.get("app", "")], p.get("mode", "testflight"), p.get("ref", "")
          else:
              apps, mode, ref = sorted(d.name for d in Path("apps").iterdir() if (d / "app.json").exists()), "check", ""
          for a in apps:
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", a) or not Path(f"apps/{a}/app.json").exists():
                  raise SystemExit(f"::error::apps/{a}/app.json がありません")
          if mode not in ("check", "testflight", "store", "review", "preview"):
              raise SystemExit(f"::error::mode は check / testflight / store / review / preview")
          if ref and not re.fullmatch(r"[A-Za-z0-9._/-]+", ref):
              raise SystemExit("::error::ref に使えない文字があります")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apps={json.dumps(apps)}\nmode={mode}\nref={ref}\n")
          print(apps, mode, ref)
          EOF

  shots:
    needs: plan
    if: needs.plan.outputs.mode != 'testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      MODE: ${{ needs.plan.outputs.mode }}
      GAME_REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 道具を入れる
        run: |
          pip install -q fonttools pillow playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: ゲームを取りこむ
        run: python scripts/prepare.py "$APP" --ref "$GAME_REF"
      - name: スクショを撮る（iPhone 6.9 インチ・iPad 13 インチ）
        run: python scripts/shots.py render "$APP"
      - name: 宣伝の絵に包む（app.json に promo があるアプリだけ。案A。元のスクショは build/<app>/promo/raw）
        run: python scripts/promo.py shots "$APP"
      - uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ matrix.app }}
          path: build/${{ matrix.app }}/fastlane/screenshots
          retention-days: 30
      - name: プレビュー動画を送る関数のテスト（にせの App Store Connect）
        run: python scripts/test_asc_previews.py
      - name: プレビュー動画を作る（app.json に preview があるアプリだけ。preview・store のとき）
        if: env.MODE == 'preview' || env.MODE == 'store'
        # store では、動画が作れなくても文とスクショは送る（このステップが落ちても build に進む）
        continue-on-error: ${{ env.MODE == 'store' }}
        run: |
          which ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          python scripts/preview.py render "$APP"
      - name: 縦の宣伝動画を作る（promo.motion があるアプリ・preview のとき。App Store には送らない）
        if: env.MODE == 'preview'
        run: python scripts/promo.py video "$APP"
      - uses: actions/upload-artifact@v5
        if: env.MODE == 'preview'
        with:
          name: promo-${{ matrix.app }}
          path: build/${{ matrix.app }}/promo/*.mp4
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: env.MODE == 'preview' || env.MODE == 'store'
        with:
          name: previews-${{ matrix.app }}
          path: |
            build/${{ matrix.app }}/previews/*/*.mp4
            build/${{ matrix.app }}/previews/preview.json
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: [plan, shots]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'preview' && needs.shots.result != 'failure' && needs.shots.result != 'cancelled'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      MODE: ${{ needs.plan.outputs.mode }}
      GAME_REF: ${{ needs.plan.outputs.ref }}
      BUILD_NO: ${{ github.run_number }}.${{ github.run_attempt }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Apple の鍵の確認
        if: env.MODE != 'check' && (env.ASC_KEY_ID == '' || env.ASC_ISSUER_ID == '' || env.ASC_KEY_P8 == '' || env.APPLE_TEAM_ID == '')
        run: |
          echo "::error::Secrets（ASC_KEY_ID・ASC_ISSUER_ID・ASC_KEY_P8・APPLE_TEAM_ID）がそろっていません"
          exit 1

      - name: Xcode をえらぶ
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | grep -v -i -E 'beta|candidate' | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version | head -1

      - name: 道具を入れる
        run: |
          brew install xcodegen >/dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q fonttools pillow pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: ゲームを取りこんでプロジェクトを作る
        run: |
          python3 scripts/prepare.py "$APP" --ref "$GAME_REF" --build-number "$BUILD_NO"
          cd "build/$APP/project" && xcodegen generate --spec project.json --quiet

      - name: シミュレーターで起動を確かめる
        if: env.MODE == 'check'
        run: bash scripts/smoke.sh "$APP"

      - name: スクショを受け取る
        if: env.MODE == 'store' || env.MODE == 'review'
        uses: actions/download-artifact@v5
        with:
          name: screenshots-${{ matrix.app }}
          path: build/${{ matrix.app }}/fastlane/screenshots

      - name: プレビュー動画を受け取る（preview がないアプリは成果物がないので、なくても止めない）
        if: env.MODE == 'store'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: previews-${{ matrix.app }}
          path: build/${{ matrix.app }}/previews

      - name: バンドル ID とアプリの確認（testflight で app.json に gameCenter があれば Game Center も用意）
        id: asc
        if: env.MODE != 'check'
        run: |
          GC=""; [ "$MODE" = testflight ] && [ -n "${LEADERBOARD_ID:-}" ] && GC="--game-center"
          python3 scripts/asc.py setup $GC

      - name: TestFlight に送る
        if: env.MODE == 'testflight' && steps.asc.outputs.has_app == 'true'
        run: bash scripts/upload.sh "$APP" "$BUILD_NO"

      - name: ストアの文とスクショを送る（review なら審査に出す）
        if: (env.MODE == 'store' || env.MODE == 'review') && steps.asc.outputs.has_app == 'true'
        run: |
          python3 scripts/asc.py key-json "$RUNNER_TEMP/asc_key.json"
          SUBMIT=false; [ "$MODE" = review ] && SUBMIT=true
          # review は文とスクショを送らない（先に store で送る）。deliver は文を送るとき、審査の添付ファイル（画面収録など）を消すため（11/10 パチおばで動画が消えた）
          SKIP=""; [ "$MODE" = review ] && SKIP="--skip_metadata true --skip_screenshots true"
          # コンテンツの権利（app.json の store.thirdPartyContent。asc.py setup でも送っている）
          CR=""
          [ "${CONTENT_RIGHTS:-}" = USES_THIRD_PARTY_CONTENT ] && CR=', "content_rights_contains_third_party_content": true, "content_rights_has_rights": true'
          [ "${CONTENT_RIGHTS:-}" = DOES_NOT_USE_THIRD_PARTY_CONTENT ] && CR=', "content_rights_contains_third_party_content": false'
          # deliver は今いる場所に fastlane/metadata（か Deliverfile）がないと「設定を作るか」と聞いて止まるので、build/<アプリ> に移って動かす
          cd "build/$APP"
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc_key.json" --platform ios \
            --app_identifier "$BUNDLE_ID" --app_version "$APP_VERSION" \
            --metadata_path fastlane/metadata --screenshots_path fastlane/screenshots \
            --skip_binary_upload true --overwrite_screenshots true --force true \
            --run_precheck_before_submit false --automatic_release false \
            --submit_for_review "$SUBMIT" $SKIP --submission_information "{\"add_id_info_uses_idfa\": false$CR}"

      - name: プレビュー動画を送る（store・preview があるアプリだけ。前の動画は入れかえ。失敗しても警告だけ）
        if: env.MODE == 'store' && steps.asc.outputs.has_app == 'true' && hashFiles(format('build/{0}/previews/preview.json', matrix.app)) != ''
        continue-on-error: true
        run: python3 scripts/asc.py previews "build/$APP/previews"
