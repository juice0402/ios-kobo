<!doctype html><html><head><meta charset=utf-8>
<!-- 縦の宣伝動画「画用紙と机」（promo.theme paper）のページ。scripts/promo.py video がフォント・おわりの文・データ（下の印）を入れ、render(t) で1コマずつ撮る。
     動き：はじめに方眼が上から引かれ、竹のものさしが左からすべりこむ／1行目はマスキングテープが左から貼られて文字が出る／
     2行目は場面ごとに ink（筆で左から書くように）・drop（1文字ずつ落ちてきて、ゲームのように着地してはずむ）・stamp（ポンと押す）／
     朱の花丸は線を描くように（stamp は判のように押す）／画面は紙のように少し傾いて下から置かれ、角にテープが貼られる／
     clip の場面はプレビュー動画の一部が画面の中で動く／切りかえは紙をずらすように／おわりはタイトルの絵が最後の場面の上に落ちてきて、テープと花丸 -->
<style>
@font-face{font-family:K;src:url('__FONT__');font-weight:600}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f4ecda}
body{font-family:K;font-weight:600;position:relative;color:#2b241f}
#bg,#cover{position:absolute;inset:0}
.scene{position:absolute;inset:0;will-change:transform;transform-origin:50% 60%}
.hd{position:absolute;top:128px;left:0;right:0;text-align:center;white-space:nowrap}
.l1w{position:relative;display:inline-block;padding:10px 46px 14px}
.tp1{position:absolute;inset:0;transform-origin:0 50%}
.l1{position:relative;display:inline-block;font-size:70px;letter-spacing:.05em;color:#3b3129}
.l2w{position:relative;display:inline-block;margin-top:26px}
.l2{display:inline-block;font-size:122px;line-height:1.1;letter-spacing:.04em;text-shadow:0 2px 0 rgba(255,253,246,.75),0 0 2px rgba(43,36,31,.35)}
.ch{display:inline-block;will-change:transform}
svg.hm{position:absolute;width:144px;height:144px;right:-146px;top:-44px;mix-blend-mode:multiply;overflow:visible}
svg.hm path{fill:none;stroke:#cf3a2c;stroke-width:6.6;stroke-linecap:round;stroke-linejoin:round}
#rl{position:absolute;left:-43px;top:478px;width:1166px;height:50px;transform-origin:0 50%;filter:drop-shadow(0 7px 8px rgba(70,45,20,.30))}
#rl img{position:absolute;inset:0;width:100%;height:100%}
#rl i{position:absolute;inset:0}
.fr{position:absolute;left:50%;top:520px;padding:12px;border-radius:58px;background:#fffdf7;transform-origin:50% 0;
  box-shadow:0 0 0 1px rgba(120,90,50,.14),0 28px 58px -10px rgba(70,45,20,.38),0 5px 13px rgba(70,45,20,.16)}
.fr img{display:block;border-radius:47px}
.tw{position:absolute;top:-34px;width:220px;height:66px;filter:drop-shadow(0 3px 4px rgba(80,55,20,.22))}
.tw.a{left:-86px}.tw.b{right:-86px}
.tw b,.tpe{position:absolute;inset:0}
#end{position:absolute;inset:0;opacity:0}
#end .card{position:absolute;left:50%;top:170px;width:760px;margin-left:-394px;padding:14px;background:#fffdf7;border-radius:10px;transform-origin:50% 0;
  box-shadow:0 0 0 1px rgba(120,90,50,.14),0 30px 60px -10px rgba(70,45,20,.40),0 6px 14px rgba(70,45,20,.16)}
#end .card img{display:block;width:760px;border-radius:4px}
#end .tw.c{left:50%;top:-30px;margin-left:-120px;width:240px;height:70px}
#end svg.hm{width:190px;height:190px;right:-70px;top:-60px}
#end .t1w{position:absolute;top:1430px;left:0;right:0;text-align:center}
#end .t1b{position:relative;display:inline-block;padding:12px 52px 18px}
#end .t1{position:relative;font-size:76px;letter-spacing:.05em}
#end .t2{position:absolute;top:1580px;left:0;right:0;text-align:center;font-size:46px;letter-spacing:.08em;color:#6b5d50}
#veil{position:absolute;inset:0;background:#f4ecda;opacity:0;pointer-events:none}
</style></head><body>
<div id=bg></div><div id=cover></div>
<div id=rl><img id=ruler><i></i></div>
<div id=scenes></div>
<div id=end><div class=card><img id=title><span class="tw c"><b></b></span><svg class=hm viewBox="-64 -64 128 128"><path/></svg></div>
  <div class=t1w><span class=t1b><span class=tpe></span><span class=t1>__T1__</span></span></div><div class=t2>__T2__</div></div>
<div id=veil></div>
<script>
const D=__DATA__;
const W=1080,H=1920;
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// 画用紙・方眼・ものさし（方眼は、方眼のない画用紙を上からめくるように見せる）
$('#bg').style.background=D.paper;
$('#cover').style.background=`radial-gradient(ellipse at 50% 38%,rgba(255,250,236,0) 52%,rgba(122,86,40,.22) 100%),url('${D.paper_img}') center/cover,#f4ecda`;
$('#ruler').src=D.ruler;$('#rl i').setAttribute('style',D.ruler_ticks);
$('#title').src=D.title;
document.querySelectorAll('.tw b,.tpe,.tp1').forEach(e=>e.setAttribute('style',(e.getAttribute('style')||'')+';'+D.tape));
document.querySelectorAll('svg.hm path').forEach(p=>p.setAttribute('d',D.hm));
// 場面
const box=$('#scenes');
const chars=t=>[...t].map(c=>`<span class=ch>${c==' '?'&nbsp;':c}</span>`).join('');
D.scenes.forEach(s=>{
  const el=document.createElement('div');el.className='scene';
  el.innerHTML=`<div class=hd><div class=l1w><span class=tp1></span><span class=l1>${chars(s.h1)}</span></div><br>
    <div class=l2w><span class=l2>${chars(s.h2)}</span><svg class=hm viewBox="-64 -64 128 128"><path d="${D.hm}"/></svg></div></div>
    <div class=fr><img><span class="tw a"><b></b></span><span class="tw b"><b></b></span></div>`;
  box.appendChild(el);s.el=el;
  el.querySelectorAll('.tw b,.tp1').forEach(e=>e.setAttribute('style',D.tape));
  s.tp1=el.querySelector('.tp1');s.c1=[...el.querySelectorAll('.l1 .ch')];s.c2=[...el.querySelectorAll('.l2 .ch')];
  s.l1=el.querySelector('.l1');s.l2=el.querySelector('.l2');s.hm=el.querySelector('svg.hm');s.hp=s.hm.querySelector('path');
  s.fr=el.querySelector('.fr');s.img=el.querySelector('.fr img');s.ta=el.querySelector('.tw.a');s.tb=el.querySelector('.tw.b');
  // 画面の大きさ：縦長のスクショは下を少しはみ出させて大きく、切り取った動画は全部入れる
  const w=Math.min(800,(s.frames?1352:1520)*s.aspect);s.img.style.width=w+'px';s.img.style.height=(w/s.aspect)+'px';s.fr.style.marginLeft=(-(w+24)/2)+'px';
  s.img.src=s.frames?s.frames[0]:s.src;s.cur=0;
  s.L=s.hp.getTotalLength();s.hp.style.strokeDasharray=s.L;
  const n=s.c2.length;
  s.hmAt=s.fx==='ink'?.55+n*.07+.42:s.fx==='drop'?.5+(n-1)*.11+.62:.5+n*.06+.30;   // 2行目が出きったら花丸
});
const endHp=$('#end svg.hm path');const endL=endHp.getTotalLength();endHp.style.strokeDasharray=endL;
let fitted=false;
function fit(e,max){const w=e.scrollWidth;if(w>max)e.style.fontSize=(parseFloat(getComputedStyle(e).fontSize)*max/w)+'px'}

function sceneAt(t){for(let i=D.scenes.length-1;i>=0;i--)if(t>=D.scenes[i].t0)return i;return 0}

function drawScene(s,lt,xoff,rot){
  const el=s.el;el.style.display='block';el.style.transform=`translateX(${xoff}px) rotate(${rot}deg)`;el.style.opacity=1;el.style.filter='none';
  // 1行目：テープが左から貼られ、文字が出る
  const tp=eOut(lin(lt,.05,.40));s.tp1.style.transform=`rotate(-2deg) scaleX(${tp})`;s.tp1.style.opacity=tp>0?1:0;
  s.c1.forEach((c,k)=>{const p=eOut(lin(lt,.24+k*.03,.24+k*.03+.30));c.style.opacity=p;c.style.transform=`translateY(${(1-p)*18}px)`});
  // 2行目
  const n=s.c2.length;
  if(s.fx==='ink'){
    s.c2.forEach((c,k)=>{const p=lin(lt,.55+k*.07,.55+k*.07+.38),e=eInOut(p);
      c.style.clipPath=`inset(-20% ${(1-e)*100}% -20% -10%)`;c.style.filter=p<1?`blur(${(1-p)*5}px)`:'none';c.style.opacity=clamp(p*2.5);c.style.transform=`scale(${1.06-.06*e})`});
  } else if(s.fx==='drop'){
    s.c2.forEach((c,k)=>{const a=.5+k*.11,land=a+.42;
      if(lt<a){c.style.opacity=0;return}
      c.style.opacity=1;
      if(lt<land){const p=eIn(lin(lt,a,land));c.style.transform=`translateY(${-640*(1-p)}px) rotate(${s.rot[k]*(1-p)+s.tilt[k]*p}deg)`}
      else{const q=lin(lt,land,land+.34);const sq=Math.sin(Math.min(q*2,1)*Math.PI)*(1-q);const hop=q>.25?Math.sin(lin(q,.25,1)*Math.PI)*(1-q)*26:0;
        c.style.transform=`translateY(${-hop}px) rotate(${s.tilt[k]}deg) scale(${1+.12*sq},${1-.18*sq})`;c.style.transformOrigin='50% 100%'}});
  } else {
    s.c2.forEach((c,k)=>{const p=lin(lt,.5+k*.06,.5+k*.06+.28);c.style.opacity=clamp(p*3);c.style.transform=`scale(${1.7-.7*eOut(p)})`;c.style.filter=p<1?`blur(${(1-p)*3}px)`:'none'});
  }
  // 朱の花丸：線を描く（stamp は判のように押す）
  if(s.fx==='stamp'){const p=lin(lt,s.hmAt,s.hmAt+.26);s.hp.style.strokeDashoffset=0;s.hm.style.opacity=p>0?Math.min(1,p*2)*.93:0;
    s.hm.style.transform=`rotate(${-34+20*eOut(p)}deg) scale(${2.3-1.3*eOut(p)})`;}
  else{const p=eInOut(lin(lt,s.hmAt,s.hmAt+.75));s.hp.style.strokeDashoffset=s.L*(1-p);s.hm.style.opacity=p>0?.93:0;s.hm.style.transform='rotate(-14deg)'}
  // 画面：少し傾いて下から置かれ、角にテープ。そのあとゆっくり寄る
  const up=eOut(lin(lt,.12,.74));const push=1+.035*lin(lt,.8,s.len);
  s.fr.style.transform=`translateY(${(1-up)*920}px) rotate(${(1-up)*5}deg) scale(${push})`;
  [[s.ta,-38,.72],[s.tb,38,.82]].forEach(([e,r,a])=>{const p=eOut(lin(lt,a,a+.16));e.style.opacity=p;e.style.transform=`rotate(${r+(r<0?-8:8)*(1-p)}deg) scale(${1.35-.35*p})`});
}

async function setFrame(s,lt){
  if(!s.frames)return;
  const i=Math.min(s.frames.length-1,Math.max(0,Math.floor(lt*30+1e-6)));
  if(i!==s.cur){s.cur=i;s.img.src=s.frames[i];await s.img.decode().catch(()=>0)}
}

window.render=async function(t){
  if(!fitted){await document.fonts.ready;D.scenes.forEach(s=>{fit(s.l1,W-240);fit(s.l2,W-390)});fitted=true}
  // 方眼が上から引かれる・ものさしが左からすべりこむ
  const g=eOut(lin(t,.05,.95));$('#cover').style.clipPath=`inset(${g*100}% 0 0 0)`;
  const r=eOut(lin(t,.30,1.05));$('#rl').style.transform=`translateX(${-(1-r)*1250}px) rotate(-1.1deg)`;
  // 場面
  D.scenes.forEach(s=>s.el.style.display='none');
  const sw=D.swipe;const i=sceneAt(t);const s=D.scenes[i];const lt=t-s.t0;
  const nextT=(i+1<D.scenes.length)?D.scenes[i+1].t0:D.end_t0;
  const end=$('#end');
  if(t<D.end_t0){
    end.style.opacity=0;
    if(i+1<D.scenes.length&&t>nextT-sw){const e=eIn(lin(t,nextT-sw,nextT));drawScene(s,lt,-W*1.05*e,-4*e)}
    else if(i>0&&lt<sw){const e=eOut(lin(lt,0,sw));drawScene(s,lt,W*1.05*(1-e),4*(1-e))}
    else drawScene(s,lt,0,0);
    await setFrame(s,lt);
  } else {
    // おわりの1枚：タイトルの絵が落ちてきて、テープと花丸。「App Storeで配信中」
    const q=t-D.end_t0;end.style.opacity=1;
    // 最後の場面は、タイトルの絵が上に置かれるあいだに、ぼけて消える
    if(q<.62){const ls=D.scenes[D.scenes.length-1],fl=t-ls.t0,f=lin(q,.12,.62);drawScene(ls,fl,0,0);ls.el.style.opacity=1-eOut(f);ls.el.style.filter=`blur(${f*7}px)`;await setFrame(ls,fl)}
    const c=end.querySelector('.card');const p=lin(q,.0,.62);c.style.transform=`translateY(${-(1-eBack(p))*1500}px) rotate(${-6+4.5*eOut(p)}deg)`;
    const tc=end.querySelector('.tw.c');const pt=eOut(lin(q,.62,.80));tc.style.opacity=pt;tc.style.transform=`rotate(-3deg) scale(${1.35-.35*pt})`;
    const hm=end.querySelector('svg.hm');const ph=lin(q,.82,1.08);hm.style.opacity=ph>0?Math.min(1,ph*2)*.93:0;
    hm.style.transform=`rotate(${-34+20*eOut(ph)}deg) scale(${2.3-1.3*eOut(ph)})`;endHp.style.strokeDashoffset=0;
    const tb=end.querySelector('.tpe');const pb=eOut(lin(q,1.0,1.32));tb.style.transform=`rotate(-1.5deg) scaleX(${pb})`;tb.style.transformOrigin='0 50%';
    const t1=end.querySelector('.t1');const p1=eOut(lin(q,1.12,1.45));t1.style.opacity=p1;t1.style.display='inline-block';t1.style.transform=`translateY(${(1-p1)*16}px)`;
    const t2=end.querySelector('.t2');t2.style.opacity=eOut(lin(q,1.35,1.7));
  }
  // はじめは紙の色から、おわりは紙の色へ
  let v=0;if(t<.35)v=1-t/.35;const out=lin(t,D.total-.5,D.total);v=Math.max(v,out);$('#veil').style.opacity=v;
};
</script></body></html>
